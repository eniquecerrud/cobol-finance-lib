name: CI

on:
  push:
  pull_request:

jobs:
  prueba:
    name: GnuCOBOL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GnuCOBOL
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - name: Compilar y probar
        run: make test
